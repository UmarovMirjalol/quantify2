# Quantify production stack
#   cp .env.production.example .env && ./deploy/scripts/deploy.sh
#   Users → edge :APP_PORT → SPA + /api

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: quantify-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_NAME: ${APP_NAME:-Quantify}
      APP_ACCESS_TOKEN: ${APP_ACCESS_TOKEN:-}
      ENABLE_DOCS: ${ENABLE_DOCS:-false}
      ALLOW_RUNTIME_LLM_CONFIG: ${ALLOW_RUNTIME_LLM_CONFIG:-false}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-90}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      FORCE_BUILTIN_PARSER: ${FORCE_BUILTIN_PARSER:-true}
      DATABASE_URL: sqlite:////data/backtests.db
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-25}
      DATA_DIR: /app/data
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads-data:/app/uploads
      - backtest-db:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8765/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - quantify
    expose:
      - "8765"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ""
    image: quantify-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - quantify
    expose:
      - "80"

  edge:
    build:
      context: .
      dockerfile: Dockerfile.edge
    image: quantify-edge:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "${APP_PORT:-80}:80"
    networks:
      - quantify

volumes:
  backtest-db:
  uploads-data:

networks:
  quantify:
    driver: bridge
