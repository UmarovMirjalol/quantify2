# Optional HTTPS terminator in front of edge
# Usage:
#   DOMAIN=app.example.com EMAIL=ops@example.com docker compose -f docker-compose.yml -f docker-compose.https.yml up -d
#
# Requires ports 80 and 443 free on the host. Caddy obtains Let's Encrypt certs automatically.

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN=your.domain.com}
      EMAIL: ${EMAIL:-admin@example.com}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - edge
    networks:
      - quantllm

  # Edge stays internal when HTTPS overlay is used
  edge:
    ports: !override []
    expose:
      - "80"

volumes:
  caddy-data:
  caddy-config:
