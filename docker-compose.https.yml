# HTTPS via Caddy (Let's Encrypt)
#
#   # Put edge on an internal host port so Caddy can bind 80/443:
#   APP_PORT=18080 DOMAIN=app.example.com EMAIL=ops@example.com \
#     docker compose -f docker-compose.yml -f docker-compose.https.yml up -d --build
#
# Caddy proxies to edge:80 on the Docker network (not the host port).

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN=your.domain.com}
      EMAIL: ${EMAIL:-admin@example.com}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - edge
    networks:
      - quantify

volumes:
  caddy-data:
  caddy-config:
