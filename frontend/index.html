    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Quantify",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Web",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "description": "Free trading strategy backtester. Plain-English strategies become look-ahead-safe simulations with institutional metrics.",
        "featureList": [
          "Free public backtesting",
          "No API key required",
          "SMA EMA RSI MACD Bollinger strategies",
          "Look-ahead-safe execution model",
          "Strategy playbook gallery"
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Is Quantify free?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Public testing needs no signup and no API key. The built-in parser runs SMA, EMA, RSI, MACD, and Bollinger strategies for free."
            }
          },
          {
            "@type": "Question",
            "name": "Do I need an AI or OpenAI key?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Quantify uses a free built-in strategy parser. An LLM key is optional and only for broader natural-language coverage."
            }
          },
          {
            "@type": "Question",
            "name": "How do you avoid look-ahead bias?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Signals form on the bar close and orders execute on the next open. Commission and slippage are applied on every fill."
            }
          }
        ]
      }
    </script>
